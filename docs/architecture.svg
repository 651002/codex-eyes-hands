<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" width="1240" height="380">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arr-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/></marker>
    <marker id="arr-slate-down" markerWidth="10" markerHeight="7" refX="5" refY="6" orient="auto"><polygon points="0 0, 10 0, 5 7" fill="#94a3b8"/></marker>
    <marker id="arr-slate-up" markerWidth="10" markerHeight="7" refX="5" refY="1" orient="auto"><polygon points="0 7, 10 7, 5 0" fill="#94a3b8"/></marker>
  </defs>

  <!-- background -->
  <rect width="1240" height="380" fill="#0f172a"/>
  <rect width="1240" height="380" fill="url(#grid)"/>

  <!-- title -->
  <text x="24" y="30" fill="#e2e8f0" font-size="16" font-weight="700">codex-eyes-hands · 架构流程</text>
  <text x="24" y="48" fill="#64748b" font-size="10">DeepSeek Harness × 本机 Codex CLI —— 纯文本模型的眼睛和手</text>

  <!-- region boundaries -->
  <rect x="20" y="60" width="560" height="132" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="32" y="78" fill="#22d3ee" font-size="10" font-weight="600">DeepSeek Harness（本机 Web · 127.0.0.1:3080）</text>
  <rect x="610" y="60" width="600" height="182" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="622" y="78" fill="#fbbf24" font-size="10" font-weight="600">codex-bridge 技能 + 本机 Codex CLI（Windows）</text>

  <!-- return flow: codex column → lane → agent -->
  <line x1="1065" y1="216" x2="1065" y2="252" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr-slate-down)"/>
  <line x1="1065" y1="252" x2="435" y2="252" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="435" y1="252" x2="435" y2="160" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr-slate-up)"/>
  <text x="500" y="244" fill="#94a3b8" font-size="10" text-anchor="middle">结果回流：codex 文字结果 / 图片路径 → bridge 带回 → agent 翻译 · 总结 · 回答用户</text>

  <!-- arrows: calls -->
  <line x1="250" y1="122" x2="312" y2="122" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="281" y="112" fill="#67e8f9" font-size="9" text-anchor="middle">发图 / 下任务</text>
  <line x1="550" y1="122" x2="622" y2="122" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <text x="586" y="112" fill="#6ee7b7" font-size="9" text-anchor="middle">bridge &lt;模式&gt;</text>
  <line x1="880" y1="110" x2="952" y2="110" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <text x="916" y="100" fill="#6ee7b7" font-size="9" text-anchor="middle">codex exec</text>
  <line x1="880" y1="190" x2="952" y2="190" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="900" y="180" fill="#fdba74" font-size="9" text-anchor="middle">--backup auto</text>

  <!-- masks + boxes -->
  <rect x="40" y="90" width="210" height="64" rx="6" fill="#0f172a"/>
  <rect x="40" y="90" width="210" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="116" fill="white" font-size="12" font-weight="600" text-anchor="middle">DeepSeek Harness Web</text>
  <text x="145" y="136" fill="#94a3b8" font-size="10" text-anchor="middle">用户：发图 · 下任务 · 监督确认</text>

  <rect x="320" y="90" width="230" height="64" rx="6" fill="#0f172a"/>
  <rect x="320" y="90" width="230" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="435" y="116" fill="white" font-size="12" font-weight="600" text-anchor="middle">DSH Agent（纯文本模型）</text>
  <text x="435" y="136" fill="#94a3b8" font-size="10" text-anchor="middle">DeepSeek-V4-Pro · 无视觉 · 无 GUI</text>

  <rect x="630" y="90" width="250" height="64" rx="6" fill="#0f172a"/>
  <rect x="630" y="90" width="250" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="755" y="114" fill="white" font-size="12" font-weight="600" text-anchor="middle">bridge.js 包装脚本</text>
  <text x="755" y="133" fill="#94a3b8" font-size="9" text-anchor="middle">see · read · ask · gen · watch · shot · fetch · search · type</text>
  <text x="755" y="147" fill="#6ee7b7" font-size="9" text-anchor="middle">监督者模式 watch/steer · 备用切换 --backup auto</text>

  <rect x="960" y="80" width="250" height="56" rx="6" fill="#0f172a"/>
  <rect x="960" y="80" width="250" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1085" y="103" fill="white" font-size="12" font-weight="600" text-anchor="middle">Codex CLI · 主通道</text>
  <text x="1085" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">gpt-5.6-sol → CC Switch → 中转</text>

  <rect x="960" y="160" width="250" height="56" rx="6" fill="#0f172a"/>
  <rect x="960" y="160" width="250" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1085" y="183" fill="white" font-size="12" font-weight="600" text-anchor="middle">Codex CLI · 备用通道</text>
  <text x="1085" y="202" fill="#94a3b8" font-size="10" text-anchor="middle">claude-sonnet-5（含视觉）· 直连中转</text>

  <!-- legend (bottom-left) -->
  <rect x="40" y="286" width="300" height="72" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
  <line x1="58" y1="304" x2="98" y2="304" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <text x="106" y="307" fill="#94a3b8" font-size="9">调用 / 自动切换</text>
  <line x1="58" y1="326" x2="98" y2="326" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="106" y="329" fill="#94a3b8" font-size="9">结果 / 文字回流</text>
  <text x="58" y="348" fill="#64748b" font-size="9">密钥不落盘：备用通道 key 运行时从 CC Switch 数据库读取</text>
</svg>
